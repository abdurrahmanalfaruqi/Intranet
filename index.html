  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5fa;
      --card: #fff;
      --tx: #1d1530;
      --mut: #6f6584;
      --br: #e9e4f1;
      --ac: #5B338A;
      --ac2: #f0e9f8;
      --yl: #FFCE00;
      --pk: #FF009C;
      --pk2: #ffe3f2;
      --pk3: #b0006d;
      --side: #5B338A;
      --ln: #b9a6d3;
      --sh: 0 1px 2px rgba(43, 26, 69, .05), 0 6px 20px rgba(43, 26, 69, .05)
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--tx);
      display: flex;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -.005em
    }

    aside {
      width: 260px;
      background: var(--side);
      color: #fff;
      padding: 26px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column
    }

    .logo {
      padding: 0 8px 28px
    }

    .logo img {
      display: block;
      width: 110px;
      max-width: 100%;
      height: auto;
      margin-bottom: 10px
    }

    .logo small {
      display: block;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .7;
      padding-left: 6px
    }

    .mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--yl);
      color: #5B338A;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px
    }

    .lbl {
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .5;
      padding: 0 12px 8px
    }

    nav button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      color: rgba(255, 255, 255, .78);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 3px;
      position: relative;
      font-family: inherit
    }

    nav button:hover {
      background: rgba(255, 255, 255, .08);
      color: #fff
    }

    nav button.on {
      background: rgba(255, 255, 255, .14);
      color: #fff;
      font-weight: 600
    }

    nav button.on:before {
      content: "";
      position: absolute;
      left: -16px;
      top: 9px;
      bottom: 9px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--yl)
    }

    nav svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0
    }

    .foot {
      margin-top: auto;
      font-size: 12px;
      opacity: .6;
      padding: 16px 12px 0;
      border-top: 1px solid rgba(255, 255, 255, .15)
    }

    main {
      flex: 1;
      min-width: 0;
      padding: 28px 40px 48px
    }

    .top {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 28px
    }

    .sb {
      flex: 1;
      position: relative;
      max-width: 520px
    }

    .sb svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      stroke: var(--mut);
      fill: none;
      stroke-width: 2
    }

    .sb input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1px solid var(--br);
      border-radius: 12px;
      background: var(--card);
      color: var(--tx);
      font-size: 14px;
      font-family: inherit;
      outline: 0;
      box-shadow: var(--sh)
    }

    .sb input:focus {
      border-color: var(--ac)
    }

    .today {
      margin-left: auto;
      font-size: 13px;
      color: var(--mut)
    }

    .av {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--pk);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 6px
    }

    .sub {
      color: var(--mut);
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--pk);
      font-weight: 700;
      margin-bottom: 8px
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(120deg, #5B338A 0%, #47266e 100%);
      color: #fff;
      border-radius: 18px;
      padding: 34px 38px;
      margin-bottom: 22px
    }

    .hero:before {
      content: "";
      position: absolute;
      right: -60px;
      top: -80px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 0, 156, .55), transparent 70%)
    }

    .hero:after {
      content: "";
      position: absolute;
      right: 90px;
      bottom: -60px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 206, 0, .45), transparent 70%)
    }

    .hero>* {
      position: relative;
      z-index: 1
    }

    .hero .eyebrow {
      color: var(--yl)
    }

    .hero h1 {
      font-size: 30px;
      color: #fff;
      margin-bottom: 10px
    }

    .hero p {
      max-width: 520px;
      opacity: .85;
      font-size: 15px;
      line-height: 1.6
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 22px
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--br);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--sh)
    }

    .stat b {
      display: block;
      font-size: 28px;
      letter-spacing: -.02em;
      color: var(--ac)
    }

    .stat span {
      font-size: 13px;
      color: var(--mut)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--br);
      border-radius: 14px;
      padding: 20px;
      box-shadow: var(--sh);
      transition: .15s
    }

    .card.click {
      cursor: pointer
    }

    .card.click:hover {
      border-color: var(--ac);
      transform: translateY(-2px)
    }

    .card h2 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px
    }

    h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px
    }

    .mut {
      color: var(--mut);
      font-size: 13px;
      line-height: 1.5
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--ac2);
      color: var(--ac);
      font-weight: 600
    }

    .tag.g {
      background: var(--pk2);
      color: var(--pk3)
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--br);
      font-size: 14px;
      gap: 12px
    }

    .row:last-child {
      border: 0;
      padding-bottom: 0
    }

    .hol {
      display: flex;
      gap: 14px;
      align-items: center
    }

    .date {
      min-width: 52px;
      text-align: center;
      background: var(--yl);
      color: #3b1f5c;
      border-radius: 10px;
      padding: 7px 4px;
      font-weight: 700;
      font-size: 11px;
      line-height: 1.2;
      text-transform: uppercase
    }

    .date b {
      display: block;
      font-size: 19px
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px
    }

    .chip {
      padding: 8px 15px;
      border: 1px solid var(--br);
      border-radius: 99px;
      background: var(--card);
      cursor: pointer;
      font-size: 13px;
      color: var(--tx);
      font-family: inherit
    }

    .chip:hover {
      border-color: var(--pk)
    }

    .chip.on {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px
    }

    th {
      text-align: left;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--mut);
      font-weight: 600;
      padding: 0 16px 12px
    }

    td {
      padding: 14px 16px;
      border-top: 1px solid var(--br)
    }

    tbody tr {
      cursor: pointer
    }

    tbody tr:hover {
      background: var(--ac2)
    }

    .tw {
      padding: 18px 4px;
      overflow-x: auto
    }

    .tree details {
      margin-left: 20px;
      border-left: 2px solid var(--br);
      padding-left: 14px
    }

    .tree>details {
      margin-left: 0;
      border: 0;
      padding: 0;
      margin-bottom: 6px
    }

    .tree summary {
      cursor: pointer;
      padding: 8px 0;
      font-size: 14px
    }

    .tree .l1>summary {
      font-weight: 700;
      font-size: 15px;
      color: var(--ac)
    }

    .tree .l2>summary {
      font-weight: 600
    }

    .tree .leaf {
      padding: 8px 12px;
      margin: 4px 0 4px 6px;
      font-size: 13px;
      background: var(--bg);
      border: 1px solid var(--br);
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      justify-content: space-between
    }

    .tree .leaf:hover {
      border-color: var(--pk)
    }

    .tag.y {
      background: var(--yl);
      color: #3b1f5c
    }

    .hlwrap {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 16px;
      margin-bottom: 22px
    }

    .sech {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px
    }

    .sech h2 {
      font-size: 18px;
      letter-spacing: -.01em
    }

    .fcard {
      position: relative;
      min-height: 330px;
      height: 100%;
      border-radius: 18px;
      color: #fff;
      display: flex;
      align-items: flex-end;
      padding: 30px;
      overflow: hidden;
      cursor: pointer
    }

    .fcard:before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(20, 8, 36, .82), rgba(20, 8, 36, .1) 70%)
    }

    .fcard:after {
      content: "";
      position: absolute;
      right: -50px;
      top: -60px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, .28), transparent 70%)
    }

    .fin {
      position: relative;
      z-index: 1;
      max-width: 600px
    }

    .fin h2 {
      font-size: 25px;
      line-height: 1.25;
      letter-spacing: -.02em;
      margin: 12px 0 8px
    }

    .fin p {
      font-size: 14px;
      line-height: 1.6;
      opacity: .9
    }

    .fin .meta {
      font-size: 12px;
      opacity: .75;
      margin-top: 12px
    }

    .dots {
      position: absolute;
      right: 26px;
      bottom: 28px;
      display: flex;
      gap: 6px;
      z-index: 2
    }

    .dots i {
      width: 8px;
      height: 8px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .5);
      cursor: pointer;
      transition: .2s
    }

    .dots i.on {
      width: 24px;
      background: var(--yl)
    }

    .nr {
      cursor: pointer
    }

    .nr:hover b {
      color: var(--ac)
    }

    .cv {
      height: 84px;
      border-radius: 10px;
      margin-bottom: 14px
    }

    .art {
      max-width: 720px
    }

    .art p {
      line-height: 1.8;
      font-size: 15px;
      margin-bottom: 16px
    }

    .art .cv {
      height: 200px;
      border-radius: 16px;
      margin: 18px 0 24px
    }

    @media(max-width:860px) {
      .hlwrap {
        grid-template-columns: 1fr
      }

      .fcard {
        min-height: 280px;
        padding: 22px
      }
    }

    .kv {
      display: grid;
      grid-template-columns: 20px 1fr;
      gap: 10px 10px;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.5
    }

    .kv svg {
      width: 16px;
      height: 16px;
      stroke: var(--ac);
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-top: 2px
    }

    .kv small {
      display: block;
      font-size: 11px;
      color: var(--mut);
      letter-spacing: .04em
    }

    .oh {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px
    }

    .oh h3 {
      margin: 0
    }

    .st {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      white-space: nowrap
    }

    .st.o {
      background: #dff5e8;
      color: #17703c
    }

    .st.c {
      background: var(--pk2);
      color: var(--pk3)
    }

    .st.p {
      background: #fff3b0;
      color: #7a5b00
    }

    .st.n {
      background: var(--ac2);
      color: var(--mut)
    }

    .fl {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    .fl select {
      padding: 10px 14px;
      border: 1px solid var(--br);
      border-radius: 10px;
      background: var(--card);
      font-family: inherit;
      font-size: 13px;
      color: var(--tx)
    }

    .ocard {
      display: block
    }

    .oc {
      overflow-x: auto;
      padding: 22px 24px
    }

    .ot {
      min-width: max-content;
      font-size: 12px
    }

    .tn {
      display: flex;
      align-items: center
    }

    .kids {
      position: relative;
      display: flex;
      flex-direction: column;
      margin-left: 24px
    }

    .kids:before {
      content: "";
      position: absolute;
      left: -24px;
      top: 50%;
      width: 24px;
      border-top: 2px solid var(--ln)
    }

    .it {
      position: relative;
      padding: 3px 0 3px 24px
    }

    .it:before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 24px;
      border-top: 2px solid var(--ln)
    }

    .it:after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-left: 2px solid var(--ln)
    }

    .it:first-child:after {
      top: 50%
    }

    .it:last-child:after {
      bottom: 50%
    }

    .it:only-child:after {
      display: none
    }

    .ob {
      width: 200px;
      border-radius: 9px;
      padding: 8px 11px;
      background: var(--card);
      border: 1px solid var(--br);
      box-shadow: 0 2px 8px rgba(36, 22, 56, .08)
    }

    .ob b {
      display: block;
      font-weight: 700;
      line-height: 1.3
    }

    .ob span {
      display: block;
      color: var(--mut);
      margin-top: 2px;
      font-size: 11px;
      line-height: 1.4
    }

    .ob.l0 {
      background: #5B338A;
      color: #fff;
      border: 0;
      border-bottom: 4px solid var(--yl);
      padding: 13px
    }

    .ob.l0 span {
      color: var(--yl)
    }

    .ob.l0 b {
      font-size: 14px
    }

    .ob.l1 {
      background: #5B338A;
      color: #fff;
      border: 0;
      border-left: 5px solid var(--pk)
    }

    .ob.l1 span {
      color: #e8ddf5
    }

    .ob.l2 {
      border-left: 5px solid var(--pk)
    }

    .ob.l2 b {
      color: var(--ac)
    }

    .ob.l3 {
      border-left: 5px solid var(--yl)
    }

    .ob.l4 {
      border-left: 5px solid var(--ln)
    }

    .stf {
      width: 200px;
      padding: 4px 11px;
      border-radius: 7px;
      background: var(--card);
      border: 1px solid var(--br);
      white-space: nowrap;
      font-size: 12px
    }

    .stf.vac {
      color: var(--mut);
      font-style: italic;
      border-style: dashed
    }

    .stf.tl {
      border-color: var(--pk)
    }

    .lg {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      color: var(--mut);
      font-size: 12px;
      margin-bottom: 14px
    }

    .lg i {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -2px
    }

    .od {
      margin-left: 16px;
      border-left: 2px solid var(--br);
      padding-left: 14px
    }

    .od>summary {
      cursor: pointer;
      padding: 8px 0;
      font-size: 14px
    }

    .od.top {
      margin-left: 0;
      border: 0;
      padding: 0
    }

    .ls {
      margin: 6px 0 10px 16px;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--br);
      border-radius: 10px;
      font-size: 13px
    }

    .pc {
      display: inline-block;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid var(--br);
      background: var(--card);
      margin: 6px 6px 0 0
    }

    .pc.v {
      font-style: italic;
      color: var(--mut);
      border-style: dashed
    }

    a.back {
      color: var(--ac);
      text-decoration: none;
      font-weight: 600
    }

    @media(max-width:860px) {
      body {
        flex-direction: column
      }

      aside {
        width: 100%;
        height: auto;
        position: static;
        padding: 12px
      }

      .lbl,
      .foot,
      .logo small {
        display: none
      }

      .logo {
        padding: 0 4px 10px
      }

      .logo img {
        width: 80px;
        margin: 0
      }

      nav {
        display: flex;
        gap: 4px;
        overflow-x: auto
      }

      nav button {
        white-space: nowrap;
        width: auto;
        margin: 0
      }

      nav button.on:before {
        display: none
      }

      main {
        padding: 20px 16px
      }

      .two {
        grid-template-columns: 1fr
      }

      .today {
        display: none
      }

      .hero {
        padding: 26px 22px
      }
    }
  </style>
</head>

      news: () => `<div class="eyebrow">Kabar Kantor</div><h1>Berita</h1><p class="sub">Informasi terbaru dari perusahaan, HR, dan outlet. (Data contoh)</p><div class="chips">${NCAT.map(c => `<button class="chip ${c == fcat ? "on" : ""}" onclick="fcat='${c}';render()">${c}</button>`).join("")}</div>${newsCards(NEWS.filter(n => fcat == "Semua" || n.cat == fcat))}`,
      outlet: () => { const l = OUT.filter(o => (ofil.st == "Semua" || o.st == ofil.st) && (ofil.k == "Semua" || o.k == ofil.k) && (ofil.sa == "Semua" || o.sa == ofil.sa)); return `<div class="eyebrow">Jaringan</div><h1>Outlet</h1><p class="sub">Jam buka, supervisor, dan alamat outlet. Data per ${OUPD}.</p><div class="fl">${sel("st", ["Semua", "Aktif", "On Progress", "Non Aktif"], ofil.st, "Status")}${sel("k", ["Semua", ...OKOTA], ofil.k, "Kota")}${sel("sa", ["Semua", ...OSA], ofil.sa, "Supervisor area")}</div><p class="mut" style="margin-bottom:14px">Menampilkan ${l.length} dari ${OUT.length} outlet</p>${outCards(l)}` },
      sop: () => `<div class="eyebrow">Dokumen</div><h1>SOP Departemen</h1><p class="sub">Pilih divisi di bawah, atau langsung cari lewat kolom di atas.</p><div class="chips">${["Semua", ...DIVS].map(d => `<button class="chip ${d == fdiv ? "on" : ""}" onclick="fdiv='${d}';render()">${d}</button>`).join("")}</div>${sopList(sops.filter(s => fdiv == "Semua" || s.div == fdiv))}`,
      hr: () => `<div class="eyebrow">HR</div><h1>Informasi HR</h1><p class="sub">Tanggal merah dan cuti bersama, biar gampang atur jadwal. (Data contoh)</p><div class="card">${holRows(HOL.length)}</div>`,
      corp: () => `<div class="eyebrow">Perusahaan</div><h1>Corporate Action</h1><p class="sub">Kabar dan agenda terbaru dari perusahaan.</p><div class="grid">${CORP.map(c => `<div class="card"><span class="tag g">Aktif</span><h3 style="margin-top:12px">${c[0]}</h3><div class="mut">${c[1]}<br>${c[2]}</div></div>`).join("")}</div>`,
      org: () => `<div class="eyebrow">Organisasi</div><h1>Struktur Organisasi</h1><p class="sub">Orins Corp, Rev. Oktober 2026 (SO 17 Nov 2026). Geser ke samping untuk melihat bagan lengkap.</p><div class="chips"><button class="chip ${ov == "bagan" ? "on" : ""}" onclick="ov='bagan';render()">Bagan</button><button class="chip ${ov == "daftar" ? "on" : ""}" onclick="ov='daftar';render()">Daftar</button></div>${ov == "bagan" ? `<div class="lg"><span><i style="background:#5B338A"></i>CEO / Divisi</span><span><i style="background:#FF009C"></i>Departemen</span><span><i style="background:#FFCE00"></i>Seksi</span><span><i style="border:1px solid var(--ln)"></i>Staf</span></div><div class="card oc"><div class="ot">${ocNode(T, 0)}</div></div><p class="mut" style="margin-top:12px">Tanda * berarti pejabat merangkap (nama sama dengan atasan di level di atasnya).</p>` : `<div class="card">${ocList(T, 0)}</div>`}`,
      dl: () => `<div class="eyebrow">Unduhan</div><h1>Dokumen & Form</h1><p class="sub">Form yang paling sering dicari karyawan.</p><div class="grid">${["Form Cuti", "Form Reimbursement", "Form Permintaan IT", "Form Perjalanan Dinas", "Surat Keterangan Kerja", "Form Pengajuan Lembur"].map(f => `<div class="card click"><span class="tag">PDF</span><h3 style="margin-top:12px">${f}</h3><div class="mut">120 KB</div></div>`).join("")}</div>`
    };
    function openSec(s) { cur = "sop"; fdiv = "Semua"; mark("sop"); view.innerHTML = `<div class="eyebrow">SOP</div><h1>${s}</h1><p class="sub"><a class="back" href="#" onclick="go('org');return false">← Balik ke struktur</a></p>` + sopList(sops.filter(x => x.sec == s)); }
    function search(v) { v = v.trim().toLowerCase(); if (!v) return render(); const r = sops.filter(s => (s.title + s.dep + s.div + s.sec).toLowerCase().includes(v)), nw = NEWS.filter(n => (n.title + n.sum + n.cat).toLowerCase().includes(v)), ou = OUT.filter(o => (o.n + o.c + o.k + o.a + o.so + o.sa).toLowerCase().includes(v)), pp = PPL.filter(q => (q.name + q.role + q.unit).toLowerCase().includes(v)); view.innerHTML = `<h1>Hasil pencarian</h1><p class="sub">${r.length} dokumen, ${nw.length} berita, ${ou.length} outlet, dan ${pp.length} karyawan cocok dengan “${v}”</p>` + (nw.length ? `<h3 style="margin-bottom:12px">Berita</h3>` + newsCards(nw) + `<div style="height:22px"></div>` : "") + (pp.length ? `<h3 style="margin-bottom:12px">Karyawan</h3><div class="card" style="margin-bottom:22px">${pp.slice(0, 10).map(q => `<div class="row"><div><b>${q.name}</b><div class="mut">${q.role}</div></div><span class="mut" style="text-align:right;max-width:55%">${q.unit}</span></div>`).join("")}${pp.length > 10 ? `<div class="mut" style="padding-top:12px">dan ${pp.length - 10} lainnya. Persempit kata kuncinya.</div>` : ""}</div>` : "") + (ou.length ? `<h3 style="margin-bottom:12px">Outlet</h3>` + outCards(ou.slice(0, 12)) + (ou.length > 12 ? `<div class="mut" style="margin-top:10px">dan ${ou.length - 12} outlet lainnya. Persempit kata kuncinya.</div>` : "") + `<div style="height:22px"></div>` : "") + (r.length ? `<h3 style="margin-bottom:12px">SOP</h3>` : "") + (r.length || nw.length || ou.length || pp.length ? (r.length ? sopList(r) : "") : sopList([])); }
    function render() { view.innerHTML = V[cur](); if (cur == "home") setFeat(0); }
    go("home");
  </script>
</body>

</html>
